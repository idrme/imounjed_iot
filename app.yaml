apiVersion: apps/v1
kind: Deployment
metadata:
  name: wil-playground # Nom du déploiement
spec:
  replicas: 1

  selector:
    matchLabels:
      app: wil-playground # Ce déploiement contient tous les pods mon-app

  template:
    metadata:
      labels:
        app: wil-playground # Nom du pod

    spec:
      containers:
        - name: wil-playground
          image: wil42/playground:v2 # A mettre a jour vers :v2 par la suite
          ports:
            - containerPort: 8888

---
apiVersion: v1
kind: Service
metadata:
  name: wil-playground

spec:
  selector:
    app: wil-playground

  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888

  type: LoadBalancer
  # type: ClusterIP



